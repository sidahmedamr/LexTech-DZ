<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexTech DZ - إنشاء حساب</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* تنسيقات إضافية للتبويبات والاستمارات */
    body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; direction: rtl; }
    .auth-container { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 2rem; }
    .auth-card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    .auth-card h2 { text-align: center; color: #2c3e50; margin-bottom: 1.5rem; }
    .role-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 2px solid #e0e0e0; }
    .role-tab { flex: 1; padding: 10px; border: none; background: none; font-size: 16px; font-weight: 600; color: #7f8c8d; cursor: pointer; transition: 0.3s; }
    .role-tab.active { color: #2980b9; border-bottom: 2px solid #2980b9; }
    .form-group { margin-bottom: 1rem; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
    .btn-primary { width: 100%; padding: 12px; background: #2980b9; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.3s; }
    .btn-primary:hover { background: #21618c; }
    .form-note { font-size: 12px; color: #e74c3c; margin-top: 5px; display: block; }
  </style>
</head>
<body>

  <main class="auth-container">
    <div class="auth-card">
      <h2>إنشاء حساب جديد</h2>
      
      <div class="role-tabs">
        <button class="role-tab active" data-role="citizen">مستشير (مواطن)</button>
        <button class="role-tab" data-role="professional">مستشار (مهني)</button>
      </div>

      <form id="registerForm">
        <input type="hidden" id="userRole" value="مستشير">
        
        <div class="form-group">
          <input type="text" id="fullname" placeholder="الاسم الكامل" required>
        </div>
        <div class="form-group">
          <input type="email" id="emailReg" placeholder="البريد الإلكتروني" required>
        </div>
        <div class="form-group">
          <input type="password" id="passwordReg" placeholder="كلمة المرور" required>
        </div>

        <div id="professionalFields" style="display:none;">
          <div class="form-group">
            <select id="profType">
              <option value="محامي">محامي</option>
              <option value="قاضي">قاضي</option>
              <option value="موثق">موثق</option>
              <option value="مستشار قانوني">مستشار قانوني</option>
            </select>
          </div>
          <div class="form-group">
            <input type="text" id="profIdCard" placeholder="رقم البطاقة المهنية / الاعتماد">
          </div>
          <div class="form-group">
            <label style="font-size: 14px; color: #555;">رفع صورة البطاقة المهنية:</label>
            <input type="file" id="idUpload" accept="image/*, .pdf">
            <small class="form-note">سيتم مراجعة الملف من قبل الإدارة قبل تفعيل الحساب.</small>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">تسجيل الحساب</button>
      </form>
    </div>
  </main>

  <script>
    // منطق التبديل بين التبويبات
    const roleTabs = document.querySelectorAll('.role-tab');
    const professionalFields = document.getElementById('professionalFields');
    const userRoleInput = document.getElementById('userRole');

    roleTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        // إزالة التفعيل من كل الأزرار
        roleTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        // إظهار أو إخفاء حقول المهني
        if (tab.dataset.role === 'professional') {
          professionalFields.style.display = 'block';
          userRoleInput.value = 'مستشار';
          document.getElementById('profIdCard').required = true;
        } else {
          professionalFields.style.display = 'none';
          userRoleInput.value = 'مستشير';
          document.getElementById('profIdCard').required = false;
        }
      });
    });

    // إرسال البيانات إلى بوت التلغرام
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "جاري الإرسال...";
      submitBtn.disabled = true;

      const role = userRoleInput.value;
      const name = document.getElementById('fullname').value;
      const email = document.getElementById('emailReg').value;
      
      let message = `🆕 *طلب تسجيل جديد في LexTech DZ*\n\n`;
      message += `👤 *النوع:* ${role}\n`;
      message += `📝 *الاسم:* ${name}\n`;
      message += `📧 *البريد:* ${email}\n`;

      if (role === 'مستشار') {
        const profType = document.getElementById('profType').value;
        const profIdCard = document.getElementById('profIdCard').value;
        message += `💼 *المهنة:* ${profType}\n`;
        message += `🔢 *رقم الاعتماد:* ${profIdCard}\n`;
        message += `⚠️ *ملاحظة:* يوجد ملف مرفق (إن وجد).\n`;
      }

      // إعدادات البوت (قم بتغييرها بمعلومات البوت الخاص بك)
      const botToken = 'YOUR_BOT_TOKEN_HERE'; 
      const chatId = 'YOUR_CHAT_ID_HERE';

      // إعداد الأزرار التفاعلية (Inline Keyboard) للقبول والرفض
      const replyMarkup = {
        inline_keyboard: [
          [
            { text: "✅ قبول الملف", callback_data: `accept_${email}` },
            { text: "❌ رفض الملف", callback_data: `reject_${email}` }
          ]
        ]
      };

      const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: chatId,
          text: message,
          parse_mode: 'Markdown',
          reply_markup: replyMarkup
        })
      })
      .then(response => response.json())
      .then(data => {
        if(data.ok) {
          alert('تم إرسال طلبك بنجاح! سيتم مراجعته من قبل الإدارة.');
          document.getElementById('registerForm').reset();
        } else {
          alert('حدث خطأ أثناء الإرسال.');
        }
      })
      .catch(error => console.error('Error:', error))
      .finally(() => {
        submitBtn.innerText = "تسجيل الحساب";
        submitBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
