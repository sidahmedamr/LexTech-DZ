<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexTech DZ - إنشاء حساب</title>
  
  <!-- استدعاء الأيقونات والخطوط -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- استدعاء ملف الستايل الخاص بك -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* تنسيقات خاصة بصفحة التسجيل تتكامل مع الستايل الأصلي */
    
    /* خلفية الفيديو لصفحة التسجيل */
    .register-bg-wrapper {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    .register-bg-wrapper video {
      min-width: 100%; min-height: 100%;
      object-fit: cover;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .register-bg-wrapper .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(10, 37, 64, 0.9) 0%, rgba(10, 37, 64, 0.7) 100%);
    }

    /* تأثير الزجاج (Glassmorphism) للاستمارة */
    .auth-container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
    }
    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 500px; /* الحجم الافتراضي للمستشير */
      transition: max-width 0.4s ease, padding 0.4s ease;
    }
    .auth-card.expanded {
      max-width: 800px; /* يتوسع عند اختيار المستشار */
    }

    .auth-card h2 {
      text-align: center; color: var(--primary); margin-bottom: 1.5rem;
      font-size: 2rem;
    }

    /* شبكة الحقول (Grid) للمستشار */
    .form-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
    }
    .form-group.full-width { grid-column: span 2; }
    .form-group label {
      display: block; font-size: 14px; margin-bottom: 6px;
      color: var(--text-dark); font-weight: 600;
    }
    .form-note { font-size: 12px; color: var(--accent-dark); margin-top: 5px; display: block; }
    
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full-width { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <!-- خلفية الفيديو -->
  <div class="register-bg-wrapper">
    <video autoplay muted loop playsinline>
      <!-- تأكد من صحة مسار الفيديو الخاص بك -->
      <source src="images/hero-video.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
  </div>

  <main class="auth-container">
    <div class="auth-card" id="authCard">
      <h2>إنشاء حساب</h2>
      
      <!-- أزرار التبديل -->
      <div class="role-tabs">
        <button type="button" class="role-tab active" data-role="citizen">مستشير (مواطن)</button>
        <button type="button" class="role-tab" data-role="professional">مستشار (مهني)</button>
      </div>

      <form id="registerForm">
        <input type="hidden" id="userRole" value="مستشير">
        
        <!-- الحقول المشتركة والأساسية -->
        <div class="form-group full-width">
          <input type="text" id="fullname" placeholder="الاسم الكامل" required>
        </div>
        <div class="form-group full-width">
          <input type="email" id="emailReg" placeholder="البريد الإلكتروني" required>
        </div>
        <div class="form-group full-width">
          <input type="password" id="passwordReg" placeholder="كلمة المرور" required>
        </div>

        <!-- حقول المستشار (مخفية افتراضياً) -->
        <div id="professionalFields" style="display:none; margin-top: 15px;">
          <h3 style="font-size: 1.2rem; color: var(--gold-dark); margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
            المعلومات المهنية والشخصية
          </h3>
          
          <div class="form-grid">
            <div class="form-group">
              <label>رقم بطاقة التعريف الوطنية (NIN)</label>
              <input type="text" id="nin" placeholder="18 رقم" maxlength="18">
            </div>
            
            <div class="form-group">
              <label>تاريخ الميلاد</label>
              <input type="date" id="dob">
            </div>

            <div class="form-group">
              <label>رقم الهاتف</label>
              <input type="tel" id="phone" placeholder="05/06/07...">
            </div>

            <div class="form-group">
              <label>الصفة المهنية</label>
              <select id="profType">
                <option value="محامي">محامي</option>
                <option value="قاضي">قاضي</option>
                <option value="موثق">موثق</option>
                <option value="مستشار قانوني">مستشار قانوني</option>
              </select>
            </div>

            <!-- قائمة الولايات (تُملأ برمجياً) -->
            <div class="form-group">
              <label>الولاية</label>
              <select id="wilayaSelect">
                <option value="" disabled selected>اختر الولاية...</option>
              </select>
            </div>

            <!-- قائمة البلديات (تُملأ بناءً على الولاية) -->
            <div class="form-group">
              <label>البلدية</label>
              <select id="baladiyaSelect" disabled>
                <option value="" disabled selected>اختر البلدية...</option>
              </select>
            </div>

            <div class="form-group full-width">
              <label>رقم الاعتماد / البطاقة المهنية</label>
              <input type="text" id="profIdCard" placeholder="رقم التسجيل في النقابة">
            </div>

            <div class="form-group full-width">
              <label>ملف إثبات المهنة (صورة/PDF)</label>
              <input type="file" id="idUpload" accept="image/*, .pdf" style="padding: 10px; background: #fff;">
              <small class="form-note"><i class="fas fa-info-circle"></i> سيتم المراجعة من الإدارة قبل تفعيل الحساب المهني.</small>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-block" id="submitBtn" style="margin-top: 20px;">
          <i class="fas fa-user-plus"></i> تأكيد التسجيل
        </button>
      </form>
      
      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        <a href="login.html" style="color: var(--primary); font-weight: 600;">لديك حساب بالفعل؟ تسجيل الدخول</a>
      </p>
    </div>
  </main>

  <!-- استدعاء ملف بيانات الجزائر -->
  <!-- تأكد من أن مسار الملف صحيح (مثلاً: js/algeria-data.js) -->
  <script src="js/algeria-data.js"></script>

  <script>
    // 1. منطق التبديل بين المستشير والمستشار (توسيع وتضييق الاستمارة)
    const roleTabs = document.querySelectorAll('.role-tab');
    const professionalFields = document.getElementById('professionalFields');
    const userRoleInput = document.getElementById('userRole');
    const authCard = document.getElementById('authCard');
    
    // الحقول الإجبارية للمستشار
    const profRequiredFields = ['nin', 'dob', 'phone', 'wilayaSelect', 'baladiyaSelect', 'profIdCard'];

    roleTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        roleTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        if (tab.dataset.role === 'professional') {
          professionalFields.style.display = 'block';
          userRoleInput.value = 'مستشار';
          authCard.classList.add('expanded'); // توسيع البطاقة لتعرض الـ Grid براحة
          profRequiredFields.forEach(id => document.getElementById(id).required = true);
        } else {
          professionalFields.style.display = 'none';
          userRoleInput.value = 'مستشير';
          authCard.classList.remove('expanded'); // تضييق البطاقة
          profRequiredFields.forEach(id => document.getElementById(id).required = false);
        }
      });
    });

    // 2. منطق ربط الولايات والبلديات (بناءً على ملف algeria-data.js)
    /* 
       ملاحظة: هذا الكود يفترض أن ملف algeria-data.js يحتوي على مصفوفة (Array) 
       باسم `algeriaCities` أو أنك قمت بضبطه مسبقاً.
       الشكل الافتراضي المتوقع: 
       [ { wilaya_name: "Adrar", wilaya_code: "01", daira_name: "...", commune_name: "..." }, ... ] 
       أو كائنات جاهزة. الكود أدناه هو الهيكل الذي يجب مواءمته مع بنية ملفك.
    */
    const wilayaSelect = document.getElementById('wilayaSelect');
    const baladiyaSelect = document.getElementById('baladiyaSelect');

    // الدالة أدناه تعمل في حال كان لديك متغير عام يسمى algeriaData (من ملفك js)
    document.addEventListener("DOMContentLoaded", function() {
      // قم بتفعيل هذا الكود وتعديله حسب هيكل المتغير الموجود في ملف algeria-data.js
      /*
      if (typeof algeriaData !== 'undefined') {
        // تعبئة الولايات الفريدة
        const wilayas = [...new Set(algeriaData.map(item => item.wilaya_name))];
        wilayas.forEach(wilaya => {
          let option = document.createElement('option');
          option.value = wilaya; option.text = wilaya;
          wilayaSelect.add(option);
        });

        // عند تغيير الولاية، نعبئ البلديات التابعة لها
        wilayaSelect.addEventListener('change', function() {
          baladiyaSelect.innerHTML = '<option value="" disabled selected>اختر البلدية...</option>';
          baladiyaSelect.disabled = false;
          const selectedWilaya = this.value;
          
          const baladiyas = algeriaData.filter(item => item.wilaya_name === selectedWilaya);
          baladiyas.forEach(b => {
            let option = document.createElement('option');
            option.value = b.commune_name; option.text = b.commune_name;
            baladiyaSelect.add(option);
          });
        });
      }
      */
    });

    // 3. إرسال البيانات لبوت التلغرام (نفس الكود الخاص بك مع تحديث البيانات)
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const originalBtnHtml = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
      submitBtn.disabled = true;

      const role = userRoleInput.value;
      const name = document.getElementById('fullname').value;
      const email = document.getElementById('emailReg').value;
      
      let message = `🆕 *طلب تسجيل جديد | LexTech DZ*\n\n`;
      message += `👤 *حساب:* ${role}\n`;
      message += `📝 *الاسم:* ${name}\n`;
      message += `📧 *البريد:* ${email}\n\n`;

      if (role === 'مستشار') {
        const nin = document.getElementById('nin').value;
        const phone = document.getElementById('phone').value;
        const wilaya = wilayaSelect.value;
        const baladiya = baladiyaSelect.value;
        const profType = document.getElementById('profType').value;
        const profIdCard = document.getElementById('profIdCard').value;

        message += `🪪 *رقم التعريف:* \`${nin}\`\n`;
        message += `📱 *الهاتف:* ${phone}\n`;
        message += `📍 *الموقع:* ${wilaya} - ${baladiya}\n`;
        message += `💼 *المهنة:* ${profType}\n`;
        message += `🔢 *رقم الاعتماد:* \`${profIdCard}\`\n`;
      }

      const botToken = '8256459512:AAHsjLjpcv2IlkpovydTIkoImyOkirtDWh0'; 
      const chatId = '-5482645875';
      const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

      const replyMarkup = role === 'مستشار' ? {
        inline_keyboard: [[
          { text: "✅ قبول المهني", callback_data: `accept_${email}` },
          { text: "❌ رفض", callback_data: `reject_${email}` }
        ]]
      } : {}; // المستشير (المواطن) لا يحتاج أزرار قبول بالضرورة لأنه يسجل مباشرة

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: chatId,
          text: message,
          parse_mode: 'Markdown',
          reply_markup: replyMarkup
        })
      })
      .then(response => response.json())
      .then(data => {
        if(data.ok) {
          alert('تم التسجيل بنجاح!');
          document.getElementById('registerForm').reset();
        } else {
          alert('حدث خطأ أثناء الإرسال.');
        }
      })
      .catch(error => console.error('Error:', error))
      .finally(() => {
        submitBtn.innerHTML = originalBtnHtml;
        submitBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
